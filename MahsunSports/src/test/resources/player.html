<script>            getStreamSource() {
                const urlParams = new URLSearchParams(window.location.search);
                const id = urlParams.get('id');
                const useRealStream = urlParams.get('real') === '1';

                if (!id) return null;

                const baseurls = [
                    "https://andro.evrenesoglu99.click/checklist/",
                    "https://andro.evrenesoglu99.click/checklist/"
                ];
                const baseurl = baseurls[Math.floor(Math.random() * baseurls.length)];
                // Normal: batutest. Yenile (?real=1) ile androstreamlivebs1 gerçek yayına geçer.
                if ((id === "androstreamlivebs1" || id === "facebooklivebs1") && !useRealStream) {
                    return baseurl + "batutest.m3u8";
                }

                if (id.startsWith("facebooklive")) {
                    return baseurl + id + ".m3u8";
                }

                if (id.startsWith("androstreamlive")) {
                    if (isIOS) {
                        const suffix = id.substring("androstreamlive".length);
                        const fbId = "facebooklive" + suffix;
                        return baseurl + fbId + ".m3u8";
                    }
                    return baseurl + id + ".m3u8";
                }

                return null;
            }

</script>
