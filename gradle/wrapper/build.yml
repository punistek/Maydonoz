name: Build PARS Plugins

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Show build configuration
        run: |
          echo "Gradle wrapper:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          echo "CloudStream Gradle plugin:"
          grep -E "recloudstream:gradle|com\.lagradost\.cloudstream3:gradle" build.gradle.kts || true

      - name: Install CloudStream Gradle plugin locally
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/cloudstream-gradle
          git clone https://github.com/recloudstream/gradle.git /tmp/cloudstream-gradle
          cd /tmp/cloudstream-gradle
          git checkout 32895aedb6
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Bind repository URLs to this GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          echo "Using repository: $GITHUB_REPOSITORY"
          grep -RIl --exclude-dir=.git 'punistek/pars-plugins' . | while read -r file; do
            sed -i "s#punistek/pars-plugins#$GITHUB_REPOSITORY#g" "$file"
          done

      - name: Build all plugins
        run: |
          chmod +x ./gradlew
          ./gradlew make makePluginsJson

      - name: Verify generated repository
        run: |
          test -f build/plugins.json
          COUNT=$(find . -type f -name '*.cs3' | wc -l)
          echo "Generated CS3 count: $COUNT"
          test "$COUNT" -gt 0

      - name: Prepare builds branch
        run: |
          rm -rf /tmp/pars-builds
          mkdir -p /tmp/pars-builds
          cp build/plugins.json /tmp/pars-builds/plugins.json
          cp repo.json /tmp/pars-builds/repo.json
          [ -f plugin-meta.json ] && cp plugin-meta.json /tmp/pars-builds/plugin-meta.json || true
          [ -f notices.json ] && cp notices.json /tmp/pars-builds/notices.json || true
          find . -type f -name '*.cs3' -exec cp {} /tmp/pars-builds/ \;
          ls -lah /tmp/pars-builds

      - name: Publish builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: /tmp/pars-builds
          force_orphan: true
